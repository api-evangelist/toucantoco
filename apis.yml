aid: toucantoco
name: Toucan Toco
description: >-
  Toucan Toco is a Paris-founded embedded analytics and data storytelling platform used
  by ISVs and SaaS products to ship white-label, customer-facing dashboards and
  conversational analytics without building BI infrastructure in-house. Its
  current-generation Toucan AI cloud (toucanai.cloud) pairs guided dashboards and a
  semantic layer with an AI analytics assistant, embeds via framework-agnostic web
  components (tc-dashboard, tc-ai-assistant), authenticates embeds with server-side
  generated JWT tokens carrying row-level-security attributes, and exposes its typed
  analytics tools to any MCP-compatible agent at toucanai.cloud/api/mcp. Trusted by
  350+ companies; backed by Balderton Capital.
