apis:
- name: Toucan AI Platform API
  description: >-
    The developer surface of the Toucan AI cloud - server-side token generation
    (POST /embed/generate-token with an x-api-key header), embed delivery via web
    components loaded from /embed/embed.js, and an MCP endpoint (POST /api/mcp,
    bearer-token authenticated) exposing the platform's typed analytics tools
    (explore, query, visualize, explain) to AI agents. Reference docs also cover the
    data-steps transformation DSL used in chart queries.
